<!DOCTYPE html>
<html lang="pt-PT" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KaBuM! Grand Theft Delivery - Sobreviva 25 Segundos</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.cdnfonts.com/css/pricedown');
    </style>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-kabum': '#FF6500',
                        'brand-playstation': '#FFFFFF',
                        'brand-intel': '#0071C5',
                        'brand-acer': '#82B541',
                        'gta-pink': '#FF007F',
                        'gta-cyan': '#00FFFF',
                        'gta-green': '#54B435',
                        'city-dark': '#0A0B0E',
                        'city-accent': '#1A1C23'
                    },
                    fontFamily: {
                        'outfit': ['Outfit', 'sans-serif'],
                        'gta': ['Pricedown', 'Impact', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0A0B0E;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Estilos do Canvas e Overlays */
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            aspect-ratio: 16/9;
            background-color: #1a1a1a;
            border: 6px solid #FF6500;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(255, 101, 0, 0.3), 0 0 100px rgba(255, 0, 127, 0.1);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: optimizeSpeed; 
        }

        /* Interfaces Overlay */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 11, 14, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        .hidden { display: none !important; }

        /* HUD GTA Style */
        #hud {
            position: absolute;
            top: 20px; left: 30px; right: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
        }

        .hud-timer {
            font-family: 'Pricedown', sans-serif;
            font-size: 4.5rem;
            color: #FF007F;
            text-shadow: 3px 3px 0 #000, 0 0 15px rgba(255,0,127,0.5);
            line-height: 1;
            margin-top: -10px;
        }

        .
